<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hole Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
  /* One deliberate visual world: a risograph zine. Three inks on paper, single theme. */
  :root{
    --paper:#F8F4F1;
    --pink:#FF48B0;
    --blue:#0078BF;
    --yellow:#FFE800;
    --navy:#26275F;
    --ink-soft:#5E5878;
    --rule:rgba(38,39,95,.16);
    color-scheme:light;
  }
  html,body{background:var(--paper);color:var(--navy)}
  body{font-family:Newsreader, Georgia, 'Times New Roman', serif}
  .wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:18px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
  h1{
    margin:0;font-family:'Bagel Fat One','Arial Black',system-ui,sans-serif;font-weight:400;
    font-size:clamp(34px,6vw,54px);line-height:.95;letter-spacing:.01em;
    color:var(--pink);text-shadow:-3px -2px 0 rgba(0,120,191,.85);
  }
  .byline{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
  .stage{position:relative;aspect-ratio:16/10;max-width:100%;border:2px solid var(--navy);border-radius:3px;overflow:hidden;background:var(--paper);box-shadow:5px 5px 0 var(--pink)}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
  .hint{position:absolute;right:10px;bottom:8px;font:500 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--paper);padding:3px 7px;border:1.5px solid var(--navy);border-radius:2px;pointer-events:none;transition:opacity .4s}
  .layout{display:grid;gap:14px}
  .screen{display:grid;gap:4px;align-content:start;background:var(--paper)}
  .bar{display:flex;gap:4px}
  .seg{flex:1;padding:8px 0;border:0;background:none;cursor:pointer}
  .seg span{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
  .seg i{display:block;height:100%;background:var(--pink);transform-origin:left;transform:scaleX(0)}
  .seg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .controls button{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);background:var(--paper);border:1.5px solid var(--navy);border-radius:2px;padding:7px 12px;cursor:pointer;min-width:44px}
  .controls button:hover{background:var(--yellow)}
  .controls button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .controls #play{min-width:96px;background:var(--navy);color:var(--paper)}
  .controls #play:hover{background:var(--blue)}
  .controls #snd[aria-pressed="true"]{background:var(--pink);color:var(--paper);border-color:var(--pink)}
  .count{margin-left:auto;font:500 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .caption{display:grid;gap:14px}
  .slug{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0}
  .text{font-family:Gaegu,'Comic Sans MS',cursive;font-weight:700;font-size:clamp(23px,3vw,28px);line-height:1.3;max-width:62ch;margin:0;text-wrap:pretty}
  .chat{display:grid;gap:8px;max-width:640px}
  .chat-head{margin:0;font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .chat-head b{font-weight:500;color:var(--pink)}
  .msgs{display:flex;flex-direction:column;gap:6px;min-height:214px}
  .m{max-width:min(82%,460px);padding:9px 14px;border-radius:20px;font:17px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px;transform-origin:bottom right}
  .m.them{align-self:flex-start;background:#ECE4EC;color:var(--navy);border-bottom-left-radius:6px;transform-origin:bottom left}
  .m .who{display:block;font:500 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--pink);margin-bottom:2px}
  .m.photo{width:160px;height:100px;padding:0;background:radial-gradient(circle at 50% 74%,var(--yellow) 0 18px,transparent 19px),radial-gradient(ellipse 42% 34% at 50% 52%,transparent 96%,#D9A21E 100%),linear-gradient(#FF9ACD,#FFE34D)}
  .m.pop{animation:pop .28s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.m.pop{animation:none}}
  [hidden]{display:none!important}
  .start{position:absolute;left:0;right:0;bottom:9%;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .start button{pointer-events:auto;cursor:pointer}
  #start{font:26px 'Bagel Fat One','Arial Black',sans-serif;color:var(--paper);background:var(--pink);border:2px solid var(--navy);border-radius:999px;padding:10px 26px;box-shadow:4px 4px 0 var(--navy)}
  #start span{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;margin-left:4px;vertical-align:middle}
  #start:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--navy)}
  #start:focus-visible,.quiet:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  .quiet{font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);background:var(--paper);border:1.5px solid var(--navy);border-radius:999px;padding:5px 12px}
  .m.typing{display:flex;gap:5px;align-items:center;padding:13px 16px}
  .m.typing i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1s infinite}
  .m.typing i:nth-child(2){animation-delay:.15s}.m.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.m.typing i{animation:none}}
  @media (max-width:600px){#start{font-size:18px;padding:7px 18px}#start span{font-size:11px}.start{bottom:5%;gap:6px}.quiet{font-size:10px;padding:4px 10px}}
  .gloss{margin:0;max-width:64ch;border-left:3px solid var(--pink);padding-left:14px}
  .gloss summary{cursor:pointer;list-style:none;display:grid;gap:4px}
  .gloss summary::-webkit-details-marker{display:none}
  .gloss summary:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
  .more-cue{font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-top:2px}
  .more-cue::after{content:" +"}
  .gloss[open] .more-cue::after{content:" −"}
  .gloss p{margin:10px 0 0;font-size:18px;line-height:1.55}
  .gloss q{font-style:italic;font-size:clamp(17px,2.1vw,19px);line-height:1.45;color:var(--navy);quotes:none}
  .gloss cite{font:500 12px 'IBM Plex Mono',ui-monospace,monospace;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .stage:fullscreen{border:0;box-shadow:none;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;display:grid;place-items:center;background:var(--paper)}
  .stage:fullscreen canvas{width:min(100vw,160vh);height:auto;aspect-ratio:16/10}
  @media (max-width:600px){
    .wrap{padding-block:max(10px,env(safe-area-inset-top,0px)) 40px;gap:10px}
    h1{font-size:28px;text-shadow:-2px -1px 0 rgba(0,120,191,.85)}
    .byline,.hint,#fs,.long{display:none}
    .screen{position:sticky;top:0;z-index:3;padding-block:6px 8px;margin-inline:-16px;padding-inline:16px;box-shadow:0 8px 10px -8px rgba(38,39,95,.25)}
    .stage{box-shadow:3px 3px 0 var(--pink)}
    .seg{padding:6px 0}
    .controls{gap:6px;flex-wrap:nowrap}
    .controls button{padding:6px 10px;font-size:12px}
    .controls #play{min-width:72px}
    .msgs{min-height:150px}
    .m{font-size:16px}
    .caption{gap:10px}
  }
  @media (min-width:960px){
    .wrap{max-width:1320px}
    .layout{grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
    .screen{position:sticky;top:16px}
    .stage{width:min(100%,calc((100svh - 190px) * 1.6))}
    .msgs{min-height:0}
  }
  @media (orientation:landscape) and (max-height:520px){
    header{display:none}
    .hint{display:none}
    .wrap{padding-block:max(8px,env(safe-area-inset-top,0px)) 32px}
    .stage{width:min(100%,calc((100svh - 20px) * 1.6));justify-self:center}
  }
</style>
</head>
<body style="margin:0">

<div class="wrap">
  <header>
    <h1>The Hole Story</h1>
    <p class="byline">A Lacanian romance in nine scenes · New York City</p>
  </header>

  <div class="layout">
    <div class="screen">
      <div class="stage">
        <canvas id="cv" aria-label="Animated story: a bagel goes on date after date in New York" role="img"></canvas>
        <div class="start" id="startBox"><button id="start">▶ Start <span>with sound</span></button><button id="startQuiet" class="quiet">or watch without sound</button></div>
      </div>
      <div class="bar" id="bar" role="group" aria-label="Scenes"></div>
      <div class="controls">
        <button id="prev" aria-label="Previous scene">◀</button>
        <button id="play">Pause</button>
        <button id="next" aria-label="Next scene">▶</button>
        <button id="snd" aria-pressed="false">♪ <span class="long">Sound </span><span id="sndState">off</span></button>
        <button id="fs" hidden>⛶ Full screen</button>
        <span class="count" id="count">1 / 9</span>
      </div>
    </div>
    <div class="caption">
      <p class="slug" id="slug"></p>
      <div class="chat">
        <p class="chat-head">Group chat · <b>Jules, Dev</b></p>
        <div class="msgs" id="msgs" aria-live="polite"></div>
      </div>
      <details class="gloss" id="glossBox">
        <summary><q id="gloss"></q><cite id="src"></cite><span class="more-cue">What's going on here</span></summary>
        <p id="more"></p>
      </details>
    </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=960,H=600;
const C={paper:'#F8F4F1',pink:'#FF48B0',blue:'#0078BF',yellow:'#FFE800',navy:'#26275F'};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const F={
  bagel:"'Bagel Fat One', 'Arial Black', sans-serif",
  hand:"Gaegu, 'Comic Sans MS', cursive",
  mono:"'IBM Plex Mono', ui-monospace, Menlo, monospace",
  serif:"Newsreader, Georgia, serif"
};
let T=0, boil=0;

/* ---------- math ---------- */
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeIn=t=>t*t, easeOut=t=>1-(1-t)*(1-t);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const PI=Math.PI, TAU=PI*2;

/* ---------- riso inks ---------- */
const OFF={pink:[1.8,-1],blue:[-1.4,1.1],yellow:[.8,1.6]};
function ink(col,fn,a=1){ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha*=a;const o=OFF[col]||[0,0];ctx.translate(o[0],o[1]);ctx.fillStyle=ctx.strokeStyle=C[col]||col;fn();ctx.restore();}
function paint(col,fn,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=ctx.strokeStyle=C[col]||col;fn();ctx.restore();}
function fillInk(col,path,a=1,rule='nonzero'){ink(col,()=>{ctx.beginPath();path();ctx.fill(rule)},a);}
function fillPaint(col,path,a=1,rule='nonzero'){paint(col,()=>{ctx.beginPath();path();ctx.fill(rule)},a);}
const HT={};
function ht(col,r=1.6,s=6){const k=col+r+s;if(HT[k])return HT[k];const c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');g.fillStyle=C[col];g.beginPath();g.arc(s/2,s/2,r,0,TAU);g.fill();return HT[k]=ctx.createPattern(c,'repeat');}
function htFill(col,r,s,path,a=1){ink(col,()=>{ctx.beginPath();path();ctx.fillStyle=ht(col,r,s);ctx.fill()},a);}

/* ---------- hand-cut shapes that boil ---------- */
const B=()=>REDUCED?0:boil;
function E(x,y,rx,ry,rot=0){ctx.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot));ctx.ellipse(x,y,rx,ry,rot,0,TAU);}
function Ci(x,y,r){E(x,y,r,r);}
function smoothClosed(P){const n=P.length,m=i=>[(P[i%n][0]+P[(i+1)%n][0])/2,(P[i%n][1]+P[(i+1)%n][1])/2];const s=m(n-1);ctx.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(i);ctx.quadraticCurveTo(P[i][0],P[i][1],e[0],e[1]);}ctx.closePath();}
function wob(cx,cy,rx,ry,seed=0,amt=1.5){const n=Math.max(16,Math.round((rx+ry)/5)),b=B(),P=[];for(let k=0;k<n;k++){const a=k/n*TAU,j=(hash(seed*13.7+k*7.31+b*3.17)-.5)*amt*2;P.push([cx+Math.cos(a)*(rx+j),cy+Math.sin(a)*(ry+j)]);}smoothClosed(P);}
function wrect(x,y,w,h,seed=0,amt=1.2){const b=B(),j=i=>(hash(seed*9.1+i*3.7+b*5.3)-.5)*amt*2;ctx.moveTo(x+j(1),y+j(2));ctx.lineTo(x+w+j(3),y+j(4));ctx.lineTo(x+w+j(5),y+h+j(6));ctx.lineTo(x+j(7),y+h+j(8));ctx.closePath();}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function cr(P){ctx.moveTo(P[0][0],P[0][1]);for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}}
function heart(x,y,s){ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s*.9,y-s*.2,x-s*.35,y-s*.95,x,y-s*.35);ctx.bezierCurveTo(x+s*.35,y-s*.95,x+s*.9,y-s*.2,x,y+s*.35);}
function sparkle(x,y,r){ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);}
function twinkle(x,y,a=1,sc=1){
  if(a<=0)return;const p=.75+.25*Math.sin(T*6+x*.01),r=9*sc*p;
  ctx.save();ctx.globalAlpha*=a;
  fillInk('pink',()=>Ci(x,y,r*1.7),.2);
  fillPaint('paper',()=>sparkle(x,y,r));fillInk('yellow',()=>sparkle(x,y,r));
  fillPaint('paper',()=>{sparkle(x+r*1.3,y-r*1.1,r*.35);Ci(x,y,r*.2);});
  ctx.restore();
}
function txt(s,x,y,o={}){ctx.save();ctx.font=o.font||`700 22px ${F.hand}`;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';if('letterSpacing' in ctx)ctx.letterSpacing=o.ls||'0px';ctx.globalAlpha*=o.a??1;ctx.fillStyle=C[o.col||'navy']||o.col;ctx.fillText(s,x,y);ctx.restore();}
function bg(){paint('paper',()=>ctx.fillRect(0,0,W,H));}

function wrapText(str,w){const words=str.split(' '),out=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>w&&cur){out.push(cur);cur=wd}else cur=t}if(cur)out.push(cur);return out;}
function bubble(x,y,str,t,a,b,o={}){
  if(t<a||t>b)return;
  const lt=t-a,sc=easeOut(clamp(lt/.22))*clamp((b-t)/.18);
  const lh=30;
  ctx.save();ctx.font=`700 27px ${F.hand}`;
  const lines=wrapText(str,(o.w||220)*1.18);
  const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+30,bh=lines.length*lh+18;
  const [tx,ty]=o.tail||[0,bh/2+34];
  const k=clamp(620/cssW,1,1.6);
  if(k>1){const px=x+tx,py=y+ty,L=px+(x-bw/2-px)*k,Rr=px+(x+bw/2-px)*k,Tp=py+(y-bh/2-py)*k,Bt=py+(y+bh/2-py)*k;let dx=0,dy=0;
    if(L<6)dx=6-L;else if(Rr>W-6)dx=W-6-Rr;if(Tp<6)dy=6-Tp;else if(Bt>H-6)dy=H-6-Bt;
    ctx.translate(px+dx,py+dy);ctx.scale(k,k);ctx.translate(-px,-py);}
  ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.strokeStyle=C.navy;ctx.fillStyle=C.paper;
  ctx.beginPath();
  let side=Math.abs(tx)>bw/2&&Math.abs(ty)<bh/2, bx,by;
  if(side){bx=Math.sign(tx)*(bw/2-2);by=clamp(ty*.4,-bh/2+14,bh/2-14);ctx.moveTo(bx,by-8);ctx.lineTo(tx,ty);ctx.lineTo(bx,by+8);}
  else{bx=clamp(tx*.35,-bw/2+18,bw/2-18);by=ty>0?bh/2-2:-bh/2+2;ctx.moveTo(bx-9,by);ctx.lineTo(tx,ty);ctx.lineTo(bx+9,by);}
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();wrect(-bw/2,-bh/2,bw,bh,o.seed||7,1.3);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.paper;
  if(side)ctx.fillRect(bx-3,by-6.5,6,13);else ctx.fillRect(bx-7.5,by-3,15,6);
  {const key=str+a,nn=Math.min(Math.floor(lt*30),str.length),pv=BLIP[key]??-1;if(nn>pv)for(let c=Math.max(pv+1,0);c<=nn&&c<str.length;c++){if(/[a-z]/i.test(str[c])&&(c===0||/[\s…—-]/.test(str[c-1]))){const w=str.slice(c).split(' ')[0];SND.blip(o.voice||'bagel',str.charCodeAt(c)+w.length*3,w.includes('?'),w.replace(/[^a-z]/gi,'').length);break;}}BLIP[key]=nn;}
  let n=Math.floor(lt*30);ctx.fillStyle=C.navy;ctx.textAlign='left';ctx.textBaseline='middle';
  lines.forEach((l,i)=>{const s=l.slice(0,Math.max(0,n));n-=l.length+1;if(s)ctx.fillText(s,-ctx.measureText(l).width/2,-bh/2+9+lh*(i+.5)+1);});
  ctx.restore();
}

/* ---------- faces ---------- */
function face(x,y,mood,sc=1,look=0){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  const ex=13,L=look*2.2;
  fillInk('pink',()=>{E(-ex-10,6,7,4);E(ex+10,6,7,4)},.5);
  ctx.fillStyle=ctx.strokeStyle=C.navy;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  const dots=(r=3.6,dy=0)=>{ctx.beginPath();Ci(-ex+L,dy,r);Ci(ex+L,dy,r);ctx.fill();ctx.fillStyle=C.paper;ctx.beginPath();Ci(-ex+L+1.2,dy-1.3,r*.33);Ci(ex+L+1.2,dy-1.3,r*.33);ctx.fill();ctx.fillStyle=C.navy;};
  const smile=(r=5)=>{ctx.beginPath();ctx.arc(L*.5,5,r,.15*PI,.85*PI);ctx.stroke();};
  const arcEyes=up=>{ctx.beginPath();for(const s of[-1,1]){const cx=s*ex+L;if(up){ctx.moveTo(cx-4.5,2);ctx.quadraticCurveTo(cx,-5,cx+4.5,2);}else{ctx.moveTo(cx-4.5,-1);ctx.quadraticCurveTo(cx,5,cx+4.5,-1);}}ctx.stroke();};
  const wavy=()=>{ctx.beginPath();ctx.moveTo(-7,9);ctx.lineTo(-3.5,6.5);ctx.lineTo(0,9);ctx.lineTo(3.5,6.5);ctx.lineTo(7,9);ctx.stroke();};
  switch(mood){
    case 'love':ctx.fillStyle=C.pink;ctx.beginPath();heart(-ex+L,1,12);heart(ex+L,1,12);ctx.fill();ctx.fillStyle=C.navy;smile(6);break;
    case 'nervous':dots(3.2);wavy();break;
    case 'shock':ctx.fillStyle=C.paper;ctx.beginPath();Ci(-ex+L,-1,5.4);Ci(ex+L,-1,5.4);ctx.fill();ctx.stroke();ctx.fillStyle=C.navy;ctx.beginPath();Ci(-ex+L,-1,2);Ci(ex+L,-1,2);ctx.fill();ctx.beginPath();E(0,11,3.6,4.6);ctx.fill();break;

const SCENES=[
  {D:8.6,draw:s0,slug:"Prologue · 6:02 AM · A bagel shop on Essex St",msgs:[["me", "ok so apparently i'm a bagel now"], ["j", "congrats?? what were you before"], ["me", "dough, i think. i genuinely can't remember"]],gloss:"The unconscious is the discourse of the Other.",src:"Jacques Lacan",more:"Lacan's starting point: nobody shows up as a finished self. You become someone by being named and talked to, and other people's words (what Lacan calls the Other: language, and everyone who spoke before you) get there first. That's also why, for him, the unconscious talks in borrowed words. Whatever gets cut away in that process, he calls the objet a: a little piece lost the moment you're made, and chased ever after. Keep an eye out for it."},
  {D:12,draw:s1,slug:"Date #1 · Lower East Side · 8:40 PM",msgs:[["me", "he's perfect. like, suspiciously perfect"], ["me", "i left without paying"], ["j", "iconic honestly"]],gloss:"Anxiety is not without an object.",src:"Jacques Lacan",more:"Freud thought anxiety was the one feeling with no object. Lacan's correction: it's not without one. You'd think anxiety comes from missing something, but it's closer to the opposite. It spikes when the thing that should stay missing gets too close. Desire needs a little gap to breathe in, so someone who wants to close every gap at once (lovingly, with biceps) can feel a lot like being smothered."},
  {D:12,draw:s2,slug:"Date #2 · SoHo · 11:15 AM",msgs:[["me", "met someone in soho. we have literally everything in common"], ["d", "babe that's you. like, the evil twink version of you"], ["me", "he's just shy"]],gloss:"I is an other.",src:"Arthur Rimbaud, as borrowed by Lacan",more:"The mirror stage: a baby sees itself in the mirror and goes “that's me!” That smooth, whole picture becomes the ego, but it's an image outside you, and a little better than you. So the self is built on a flattering mistake. And because the image is both me and not-me, we love it and compete with it at the same time, which is why romancing your own reflection rarely goes smoothly. (The shop's name, IDEAL-I, is Lacan's own term for that image.)"},
  {D:12,draw:s3,slug:"Date #3 · Times Square · All hours",msgs:[["me", "he kept asking what i want so i said whatever he wants"], ["j", "that's a brand, not a man"], ["me", "turns out he doesn't know either. weirdly hot"]],gloss:"Che vuoi? What do you want?",src:"Jacques Lacan",more:"For Lacan, we learn what to want from other people: parents, friends, the culture, a billboard. “Che vuoi?” is the anxious question underneath it all: what do you want from me? Here he's on a date with it: the city, the culture, the voice that tells you what to want. Lacan's twist is that this big Other doesn't really know either. It's inconsistent, and he draws it with a line through it. That lack in the Other is exactly what makes room for a desire of your own."},
  {D:13,draw:s4,slug:"Dates #4 through #57 · Brooklyn-bound L",msgs:[["me", "57 dates this month. all fine. none of them IT"], ["d", "what is “it”"], ["me", "if i knew i'd have it"]],gloss:"Ce n'est pas ça. (That's not it.)",src:"Jacques Lacan",more:"Lacan says desire is always desire for something else. Each date is “not it,” and that small shortfall is exactly what sends you on to the next one, the way one word leads to another in a sentence. What keeps it moving isn't any of the prospects. It's what Lacan calls the objet petit a (that little twinkle you keep spotting): the elusive something that makes every real person feel almost right, but not quite. So: not it, next. The problem was never the knish."},
  {D:12.4,draw:s5,slug:"3:07 AM · Bushwick · Outside a bodega",msgs:[["me", "been sitting in the rain for an hour thinking about one word"], ["j", "mother has spoken"]],gloss:"The unconscious is structured like a language.",src:"Jacques Lacan",more:"A Lacanian analyst listens less to what you mean and more to what you actually said: slips, puns, words that do double duty. (The title of this story is one.) An analyst might say almost nothing, hand a single word back, and end the session the moment something lands, so you walk out still chewing on it. Lacan was famous for exactly those short sessions."},
  {D:14.4,draw:s6,slug:"5:48 AM · Staten Island Ferry",msgs:[["me", "on the staten island ferry. don't ask"], ["me", "the pretzel from the app is here. he barely talks. i'm obsessed"], ["d", "marry him"]],gloss:"The real is what always comes back to the same place.",src:"Jacques Lacan",more:"The real, in Lacan's sense, is the snag you keep circling back to, like a ferry that only goes back and forth. He borrows two words from Aristotle here. Automaton is the routine, the loop. Tuché is the chance collision that breaks through it. For Lacan it's usually more of a jolt than a gift, but it's how something new gets in. Sometimes what you passed by comes back around, and this time it lands. And notice: the real doesn't talk. It interrupts."},
  {D:12.4,draw:s7,slug:"5:52 AM · Upper New York Bay",msgs:[["me", "ok i looked through it"], ["me", "__photo__"], ["j", "wait that's actually gorgeous"]],gloss:"You see that can? Well, it doesn't see you!",src:"a fisherman, to young Lacan",more:"Lacan tells this story in Seminar XI. Out on a fishing boat in his twenties, a fisherman pointed at a sardine can glinting on the waves and joked that it didn't see him. Lacan didn't find it that funny, because in a way it did: the glint came from a point out in the scene, and he was the odd one out in that picture. That's his idea of the gaze, and for him the gaze is one of the shapes the objet a takes. (Notice what's glinting on the can.) It isn't your eye; it's the spot in the world that looks back. So no, the can doesn't see you. But it does look at you. And a frame (a window, a hole) is what lets you see anything at all."},
  {D:13,draw:s8,slug:"Epilogue · Somewhere over the harbor",msgs:[["me", "we're taking the ferry again tomorrow. and the day after"], ["d", "so it's a thing??"], ["me", "it's a knot. there's a life preserver involved. i'll explain later"], ["j", "we love a knot"]],gloss:"Love is giving what you don't have.",src:"Jacques Lacan",more:"One of Lacan's most quoted lines, sometimes finished with “…to someone who doesn't want it.” He also said there's no sexual relationship: two people never add up to one perfect whole, and love is what we invent to make up for it. Nobody here fills anybody's hole; what they share is the lack itself, and the view through it. The Borromean knot is his picture of how a subject holds together: three rings, no two linked, all three holding, and cut any one and the whole thing falls apart. The letters are his three registers: I for Imaginary (images, the ego), S for Symbolic (language, rules), R for Real (whatever doesn't fit either). Here the Real is the ferry's life preserver: it stays in its place while everything goes back and forth, and nobody notices it until the horn goes off. Which ring gets which letter is our joke, not his. But the twinkle in the middle is his: that's exactly where Lacan draws the objet a, at the center where all three rings overlap, held by the knot and never in anyone's hands."}

  try{SCENES[scene].draw(story());}catch(err){console.error(err);}
  if(!grainPat)grainPat=ctx.createPattern(grain,'repeat');
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.45;const o=REDUCED?0:(boil%5)*31;ctx.translate(-o,-o*.7);ctx.fillStyle=grainPat;ctx.fillRect(o-10,o*.7-10,W+20,H+20);ctx.restore();
  if(st<.6&&scene!==7&&started&&hasSnap){const k=ease(clamp(st/.6)),x0=lerp(-100,W+140,k);
    ctx.save();ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(W+300,0);ctx.lineTo(W+300,H);ctx.lineTo(x0-90,H);ctx.closePath();ctx.clip();ctx.drawImage(snap,0,0,W,H);ctx.restore();
    htFill('pink',1.8,7,()=>{ctx.moveTo(x0-30,0);ctx.lineTo(x0,0);ctx.lineTo(x0-90,H);ctx.lineTo(x0-120,H);ctx.closePath();},.9);
    paint('navy',()=>{ctx.lineWidth=2.5;line(x0,0,x0-90,H);});}
  if(ended){const a=.6+.4*Math.sin(T*3);fillPaint('paper',()=>ctx.roundRect(W/2-120,H-54,240,34,17),.9);txt('tap to watch again',W/2,H-37,{font:`700 22px ${F.hand}`,a});}
  fills.forEach((f,i)=>f.style.transform=`scaleX(${i<scene?1:i>scene?0:clamp(st/dur(scene))})`);
  requestAnimationFrame(frame);
}
setCaption();setPlayLabel();
if(document.fonts&&document.fonts.load){[`96px ${F.bagel}`,`700 22px ${F.hand}`,`500 14px ${F.mono}`,`italic 32px ${F.serif}`].forEach(f=>document.fonts.load(f).catch(()=>{}));}
requestAnimationFrame(frame);
})();
</script>
