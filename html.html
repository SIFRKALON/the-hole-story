<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hole Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
  /* One deliberate visual world: a risograph zine. Three inks on paper, single theme. */
  :root{
    --paper:#F8F4F1;
    --pink:#FF48B0;
    --blue:#0078BF;
    --yellow:#FFE800;
    --navy:#26275F;
    --ink-soft:#5E5878;
    --rule:rgba(38,39,95,.16);
    color-scheme:light;
  }
  html,body{background:var(--paper);color:var(--navy)}
  body{font-family:Newsreader, Georgia, 'Times New Roman', serif}
  .wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:18px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
  h1{
    margin:0;font-family:'Bagel Fat One','Arial Black',system-ui,sans-serif;font-weight:400;
    font-size:clamp(34px,6vw,54px);line-height:.95;letter-spacing:.01em;
    color:var(--pink);text-shadow:-3px -2px 0 rgba(0,120,191,.85);
  }
  .byline{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0}
  .stage{position:relative;aspect-ratio:16/10;max-width:100%;border:2px solid var(--navy);border-radius:3px;overflow:hidden;background:var(--paper);box-shadow:5px 5px 0 var(--pink)}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
  .hint{position:absolute;right:10px;bottom:8px;font:500 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--paper);padding:3px 7px;border:1.5px solid var(--navy);border-radius:2px;pointer-events:none;transition:opacity .4s}
  .deck{display:grid;gap:12px}
  .bar{display:flex;gap:4px}
  .seg{flex:1;padding:8px 0;border:0;background:none;cursor:pointer}
  .seg span{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
  .seg i{display:block;height:100%;background:var(--pink);transform-origin:left;transform:scaleX(0)}
  .seg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .controls button{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);background:var(--paper);border:1.5px solid var(--navy);border-radius:2px;padding:7px 12px;cursor:pointer;min-width:44px}
  .controls button:hover{background:var(--yellow)}
  .controls button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .controls #play{min-width:96px;background:var(--navy);color:var(--paper)}
  .controls #play:hover{background:var(--blue)}
  .controls #snd[aria-pressed="true"]{background:var(--pink);color:var(--paper);border-color:var(--pink)}
  .count{margin-left:auto;font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .caption{display:grid;gap:10px;min-height:190px}
  .slug{font:500 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0}
  .text{font-size:clamp(18px,2.3vw,21px);line-height:1.45;max-width:62ch;margin:0;text-wrap:pretty}
  .gloss{margin:0;max-width:60ch;border-left:3px solid var(--pink);padding-left:14px;display:grid;gap:4px}
  .gloss q{font-style:italic;font-size:17px;line-height:1.45;color:var(--navy);quotes:none}
  .gloss cite{font:500 11px 'IBM Plex Mono',ui-monospace,monospace;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  @media (max-width:520px){.hint{display:none}.caption{min-height:240px}}
</style>
</head>
<body style="margin:0">

<div class="wrap">
  <header>
    <h1>The Hole Story</h1>
    <p class="byline">A Lacanian romance in nine scenes · New York City</p>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="Animated story: a bagel goes on date after date in New York" role="img"></canvas>
    <div class="hint" id="hint">♪ Sound is off · tap the button below</div>
  </div>

  <div class="deck">
    <div class="bar" id="bar" role="group" aria-label="Scenes"></div>
    <div class="controls">
      <button id="prev" aria-label="Previous scene">◀</button>
      <button id="play">Pause</button>
      <button id="next" aria-label="Next scene">▶</button>
      <button id="snd" aria-pressed="false">♪ Sound off</button>
      <span class="count" id="count">1 / 9</span>
    </div>
    <div class="caption" aria-live="polite">
      <p class="slug" id="slug"></p>
      <p class="text" id="text"></p>
      <p class="gloss"><q id="gloss"></q><cite id="src"></cite></p>
    </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=960,H=600;
const C={paper:'#F8F4F1',pink:'#FF48B0',blue:'#0078BF',yellow:'#FFE800',navy:'#26275F'};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const F={
  bagel:"'Bagel Fat One', 'Arial Black', sans-serif",
  hand:"Gaegu, 'Comic Sans MS', cursive",
  mono:"'IBM Plex Mono', ui-monospace, Menlo, monospace",
  serif:"Newsreader, Georgia, serif"
};
let T=0, boil=0;

/* ---------- math ---------- */
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeIn=t=>t*t, easeOut=t=>1-(1-t)*(1-t);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const PI=Math.PI, TAU=PI*2;

/* ---------- riso inks ---------- */
const OFF={pink:[1.8,-1],blue:[-1.4,1.1],yellow:[.8,1.6]};
function ink(col,fn,a=1){ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha*=a;const o=OFF[col]||[0,0];ctx.translate(o[0],o[1]);ctx.fillStyle=ctx.strokeStyle=C[col]||col;fn();ctx.restore();}
function paint(col,fn,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=ctx.strokeStyle=C[col]||col;fn();ctx.restore();}
function fillInk(col,path,a=1,rule='nonzero'){ink(col,()=>{ctx.beginPath();path();ctx.fill(rule)},a);}
function fillPaint(col,path,a=1,rule='nonzero'){paint(col,()=>{ctx.beginPath();path();ctx.fill(rule)},a);}
const HT={};
function ht(col,r=1.6,s=6){const k=col+r+s;if(HT[k])return HT[k];const c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');g.fillStyle=C[col];g.beginPath();g.arc(s/2,s/2,r,0,TAU);g.fill();return HT[k]=ctx.createPattern(c,'repeat');}
function htFill(col,r,s,path,a=1){ink(col,()=>{ctx.beginPath();path();ctx.fillStyle=ht(col,r,s);ctx.fill()},a);}

/* ---------- hand-cut shapes that boil ---------- */
const B=()=>REDUCED?0:boil;
function E(x,y,rx,ry,rot=0){ctx.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot));ctx.ellipse(x,y,rx,ry,rot,0,TAU);}
function Ci(x,y,r){E(x,y,r,r);}
function smoothClosed(P){const n=P.length,m=i=>[(P[i%n][0]+P[(i+1)%n][0])/2,(P[i%n][1]+P[(i+1)%n][1])/2];const s=m(n-1);ctx.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(i);ctx.quadraticCurveTo(P[i][0],P[i][1],e[0],e[1]);}ctx.closePath();}
function wob(cx,cy,rx,ry,seed=0,amt=1.5){const n=Math.max(16,Math.round((rx+ry)/5)),b=B(),P=[];for(let k=0;k<n;k++){const a=k/n*TAU,j=(hash(seed*13.7+k*7.31+b*3.17)-.5)*amt*2;P.push([cx+Math.cos(a)*(rx+j),cy+Math.sin(a)*(ry+j)]);}smoothClosed(P);}
function wrect(x,y,w,h,seed=0,amt=1.2){const b=B(),j=i=>(hash(seed*9.1+i*3.7+b*5.3)-.5)*amt*2;ctx.moveTo(x+j(1),y+j(2));ctx.lineTo(x+w+j(3),y+j(4));ctx.lineTo(x+w+j(5),y+h+j(6));ctx.lineTo(x+j(7),y+h+j(8));ctx.closePath();}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function cr(P){ctx.moveTo(P[0][0],P[0][1]);for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}}
function heart(x,y,s){ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s*.9,y-s*.2,x-s*.35,y-s*.95,x,y-s*.35);ctx.bezierCurveTo(x+s*.35,y-s*.95,x+s*.9,y-s*.2,x,y+s*.35);}
function sparkle(x,y,r){ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);}
function txt(s,x,y,o={}){ctx.save();ctx.font=o.font||`700 22px ${F.hand}`;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';if('letterSpacing' in ctx)ctx.letterSpacing=o.ls||'0px';ctx.globalAlpha*=o.a??1;ctx.fillStyle=C[o.col||'navy']||o.col;ctx.fillText(s,x,y);ctx.restore();}
function bg(){paint('paper',()=>ctx.fillRect(0,0,W,H));}

function wrapText(str,w){const words=str.split(' '),out=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>w&&cur){out.push(cur);cur=wd}else cur=t}if(cur)out.push(cur);return out;}
function bubble(x,y,str,t,a,b,o={}){
  if(t<a||t>b)return;
  const lt=t-a,sc=easeOut(clamp(lt/.22))*clamp((b-t)/.18);
  const lh=25;
  ctx.save();ctx.font=`700 22px ${F.hand}`;
  const lines=wrapText(str,o.w||220);
  const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+30,bh=lines.length*lh+18;
  ctx.translate(x,y);ctx.scale(sc,sc);
  const [tx,ty]=o.tail||[0,bh/2+34];
  ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.strokeStyle=C.navy;ctx.fillStyle=C.paper;
  ctx.beginPath();
  let side=Math.abs(tx)>bw/2&&Math.abs(ty)<bh/2, bx,by;
  if(side){bx=Math.sign(tx)*(bw/2-2);by=clamp(ty*.4,-bh/2+14,bh/2-14);ctx.moveTo(bx,by-8);ctx.lineTo(tx,ty);ctx.lineTo(bx,by+8);}
  else{bx=clamp(tx*.35,-bw/2+18,bw/2-18);by=ty>0?bh/2-2:-bh/2+2;ctx.moveTo(bx-9,by);ctx.lineTo(tx,ty);ctx.lineTo(bx+9,by);}
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();wrect(-bw/2,-bh/2,bw,bh,o.seed||7,1.3);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.paper;
  if(side)ctx.fillRect(bx-3,by-6.5,6,13);else ctx.fillRect(bx-7.5,by-3,15,6);
  {const key=str+a,nn=Math.min(Math.floor(lt*30),str.length),pv=BLIP[key]??-1;if(nn>pv&&Math.floor(nn/2)>Math.floor(pv/2)&&nn<str.length&&/[a-z]/i.test(str[nn]))SND.blip(o.voice||'bagel',str.charCodeAt(nn));BLIP[key]=nn;}
  let n=Math.floor(lt*30);ctx.fillStyle=C.navy;ctx.textAlign='left';ctx.textBaseline='middle';
  lines.forEach((l,i)=>{const s=l.slice(0,Math.max(0,n));n-=l.length+1;if(s)ctx.fillText(s,-ctx.measureText(l).width/2,-bh/2+9+lh*(i+.5)+1);});
  ctx.restore();
}

/* ---------- faces ---------- */
function face(x,y,mood,sc=1,look=0){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  const ex=13,L=look*2.2;
  fillInk('pink',()=>{E(-ex-10,6,7,4);E(ex+10,6,7,4)},.5);
  ctx.fillStyle=ctx.strokeStyle=C.navy;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  const dots=(r=3.6,dy=0)=>{ctx.beginPath();Ci(-ex+L,dy,r);Ci(ex+L,dy,r);ctx.fill();ctx.fillStyle=C.paper;ctx.beginPath();Ci(-ex+L+1.2,dy-1.3,r*.33);Ci(ex+L+1.2,dy-1.3,r*.33);ctx.fill();ctx.fillStyle=C.navy;};
  const smile=(r=5)=>{ctx.beginPath();ctx.arc(L*.5,5,r,.15*PI,.85*PI);ctx.stroke();};
  const arcEyes=up=>{ctx.beginPath();for(const s of[-1,1]){const cx=s*ex+L;if(up){ctx.moveTo(cx-4.5,2);ctx.quadraticCurveTo(cx,-5,cx+4.5,2);}else{ctx.moveTo(cx-4.5,-1);ctx.quadraticCurveTo(cx,5,cx+4.5,-1);}}ctx.stroke();};
  const wavy=()=>{ctx.beginPath();ctx.moveTo(-7,9);ctx.lineTo(-3.5,6.5);ctx.lineTo(0,9);ctx.lineTo(3.5,6.5);ctx.lineTo(7,9);ctx.stroke();};
  switch(mood){
    case 'love':ctx.fillStyle=C.pink;ctx.beginPath();heart(-ex+L,1,12);heart(ex+L,1,12);ctx.fill();ctx.fillStyle=C.navy;smile(6);break;
    case 'nervous':dots(3.2);wavy();break;
    case 'shock':ctx.fillStyle=C.paper;ctx.beginPath();Ci(-ex+L,-1,5.4);Ci(ex+L,-1,5.4);ctx.fill();ctx.stroke();ctx.fillStyle=C.navy;ctx.beginPath();Ci(-ex+L,-1,2);Ci(ex+L,-1,2);ctx.fill();ctx.beginPath();E(0,11,3.6,4.6);ctx.fill();break;
    case 'sad':dots(3.2,1);ctx.beginPath();ctx.moveTo(-ex-5,-5);ctx.lineTo(-ex+4,-8.5);ctx.moveTo(ex+5,-5);ctx.lineTo(ex-4,-8.5);ctx.stroke();ctx.beginPath();ctx.arc(0,13,5,1.15*PI,1.85*PI);ctx.stroke();break;
    case 'calm':arcEyes(true);smile(4.5);break;
    case 'closed':arcEyes(false);smile(4);break;
    case 'kiss':arcEyes(false);ctx.beginPath();Ci(3,9,2.6);ctx.stroke();break;
    case 'dizzy':ctx.beginPath();for(const s of[-1,1]){const cx=s*ex;ctx.moveTo(cx-3.5,-3.5);ctx.lineTo(cx+3.5,3.5);ctx.moveTo(cx+3.5,-3.5);ctx.lineTo(cx-3.5,3.5);}ctx.stroke();wavy();break;
    case 'think':dots(3.2,-2.5);ctx.beginPath();ctx.moveTo(-3,9);ctx.lineTo(4,8);ctx.stroke();break;
    case 'lidded':ctx.beginPath();for(const s of[-1,1]){const cx=s*ex+L;ctx.moveTo(cx+4.2,0);ctx.arc(cx,0,4.2,0,PI);ctx.closePath();}ctx.fill();ctx.beginPath();for(const s of[-1,1]){const cx=s*ex+L;ctx.moveTo(cx-5.5,-.6);ctx.lineTo(cx+5.5,-.6);}ctx.stroke();smile(4);break;
    default:dots();smile();
  }
  ctx.restore();
}

/* ---------- the bagel ---------- */
function bagel(x,y,s=1,o={}){
  const mood=o.mood||'happy',walk=o.walk,sit=o.sit,seed=o.seed||1;
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);
  const sq=o.squash||0;ctx.scale(s*(o.flip?-1:1)*(1+sq*.18),s*(1-sq*.18));
  const ph=walk==null?0:walk*PI,bob=walk==null?0:-Math.abs(Math.sin(ph))*5;
  if(!sit&&!o.noShadow)fillInk('navy',()=>E(0,72,44,6),.12);
  ctx.strokeStyle=C.navy;ctx.fillStyle=C.navy;ctx.lineWidth=4.5;ctx.lineCap='round';
  if(sit){line(-18,40,-22,64);line(18,40,24,64);ctx.beginPath();E(-24,65,5,3);E(26,65,5,3);ctx.fill();}
  else{const k=Math.sin(ph)*9;line(-17,42,-17-k,70);line(17,42,17+k,70);ctx.beginPath();E(-20-k,71,6,3.2);E(20+k,71,6,3.2);ctx.fill();}
  ctx.translate(0,bob);
  // arms
  ctx.lineWidth=4;const arms=o.arms||'down';
  if(arms==='up'){line(-58,0,-76,-18);line(58,0,76,-18);}
  else if(arms==='hold'){line(-58,6,-72,22);line(56,8,82,2);}
  else{line(-58,6,-72,22);line(58,6,72,22);}
  // body
  const body=()=>{wob(0,0,62,50,seed,1.6);wob(0,-6,18,11,seed+5,.8);};
  fillPaint('paper',body,1,'evenodd');
  fillInk('yellow',body,1,'evenodd');
  fillInk('pink',body,.36,'evenodd');
  ink('pink',()=>{ctx.beginPath();body();ctx.clip('evenodd');ctx.fillStyle=ht('pink',1.7,5);ctx.fillRect(-70,20,140,40);ctx.beginPath();ctx.ellipse(0,-5,27,18,0,PI,TAU);ctx.fill();},.9);
  paint('paper',()=>{ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.ellipse(0,-3,48,36,0,1.12*PI,1.48*PI);ctx.stroke();},.8);
  // seeds
  const ns=o.every?30:8,cols=['navy','pink','blue','paper'];
  for(let i=0;i<ns;i++){
    const a=PI*(1.04+.92*hash(i*3.3+seed*.7)),f=.5+.38*hash(i*7.7+seed),sx=Math.cos(a)*62*f,sy=Math.sin(a)*50*f-3;
    const col=o.every?cols[i%4]:'paper';
    (col==='paper'?fillPaint:fillInk)(col,()=>E(sx,sy,3.4,1.7,a*2+i),col==='paper'?.95:1);
  }
  if(o.fill>0){const r=o.fill;const p=()=>wob(0,-6,18+r*9,11+r*7,seed+9,1.4);fillPaint('paper',p);fillInk('blue',p,.12);ink('blue',()=>{ctx.beginPath();p();ctx.clip();ctx.fillStyle=ht('blue',1.4,5);ctx.fillRect(-40,-2,80,30);},.6);}
  face(0,25,mood,1,o.look||0);
  if(mood==='nervous'||mood==='shock'){const d=(T*1.6)%1;fillInk('blue',()=>{ctx.moveTo(52,-30+d*16);ctx.quadraticCurveTo(46,-16+d*16,52,-14+d*16);ctx.quadraticCurveTo(58,-16+d*16,52,-30+d*16);},1-d*.6);}
  ctx.restore();
}

/* ---------- the pretzel ---------- */
const PZ=[[30,32],[20,5],[0,-22],[-15,-44],[-40,-42],[-52,-12],[-42,22],[0,44],[42,22],[52,-12],[40,-42],[15,-44],[0,-22],[-20,5],[-30,32]];
function pretzel(x,y,s=1,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s*(o.flip?-1:1),s);
  if(!o.noLegs){ctx.strokeStyle=ctx.fillStyle=C.navy;ctx.lineWidth=4.5;ctx.lineCap='round';
    if(o.sit){line(-10,50,-16,66);line(10,50,16,66);ctx.beginPath();E(-18,67,5,3);E(18,67,5,3);ctx.fill();}
    else{line(-10,50,-11,70);line(10,50,11,70);ctx.beginPath();E(-14,71,6,3);E(14,71,6,3);ctx.fill();}}
  const b=B(),P=PZ.map((p,i)=>[p[0]+(hash(i*5.1+b)-.5)*1.4,p[1]+(hash(i*2.3+b*1.7)-.5)*1.4]);
  const st=(lw)=>{ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();cr(P);ctx.stroke();};
  const col=o.col;
  if(col){paint(col,()=>st(17));}
  else{paint('paper',()=>st(17));ink('yellow',()=>st(17));ink('pink',()=>st(17),.58);ink('blue',()=>st(17),.17);
    ink('pink',()=>{ctx.translate(0,3.5);ctx.strokeStyle=ht('pink',1.5,5);st(7);},.9);
    paint('paper',()=>{ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-44,-36);ctx.quadraticCurveTo(-30,-47,-17,-42);ctx.moveTo(44,-36);ctx.quadraticCurveTo(30,-47,17,-42);ctx.stroke();},.7);
    for(let i=0;i<PZ.length-1;i++){if(i===6||i===7)continue;const a=PZ[i],c=PZ[i+1];for(let k=0;k<2;k++){const u=.3+k*.4,sx=lerp(a[0],c[0],u)+(hash(i*9+k)-.5)*6,sy=lerp(a[1],c[1],u)+(hash(i*4+k)-.5)*5;fillPaint('paper',()=>{ctx.save();ctx.translate(sx,sy);ctx.rotate(hash(i+k)*3);ctx.rect(-1.8,-1.8,3.6,3.6);ctx.restore();});}}
    face(0,41,o.mood||'lidded',.72,o.look||0);}
  ctx.restore();
}

/* ---------- supporting cast ---------- */
function schmear(x,y,s=1,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);

   gloss:"Repetition insists, and keeps missing its mark. Once in a while the miss is where something new gets through.",src:'Seminar XI'},
  {D:11.2,draw:s7,slug:'5:52 AM · Upper New York Bay',
   text:"He stops trying to fill the hole and looks through it instead. The whole city fits inside.",
   gloss:"Desire isn't there to be satisfied, only kept alive. The lack is what gives you a place to see from.",src:'after Seminar VI, Desire and Its Interpretation'},
  {D:13,draw:s8,slug:'Epilogue · Somewhere over the harbor',
   text:"Nobody completes anybody. They hook their holes together, a life ring makes three, and the whole thing holds. Take away any one loop and it all falls apart. That's the knot.",
   gloss:"Love is giving what you don't have. Also: there is no sexual relationship. There is, however, a 6:15 ferry back.",src:'Seminar VIII, Seminar XX, and the ferry schedule'}
];

/* ================= playback ================= */
const $=id=>document.getElementById(id);
const bar=$('bar'),fills=[];
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.className='seg';b.setAttribute('aria-label',`Scene ${i+1}: ${s.slug}`);const sp=document.createElement('span'),f=document.createElement('i');sp.appendChild(f);b.appendChild(sp);b.addEventListener('click',()=>go(i));bar.appendChild(b);fills.push(f);});
let scene=0,st=0,playing=!REDUCED,ended=false;
function setCaption(){const s=SCENES[scene];$('slug').textContent=s.slug;$('text').textContent=s.text;$('gloss').textContent=s.gloss;$('src').textContent='— '+s.src;$('count').textContent=`${scene+1} / ${SCENES.length}`;}
function setPlayLabel(){$('play').textContent=ended?'Replay':playing?'Pause':'Play';}
function go(i){scene=(i+SCENES.length)%SCENES.length;st=0;ended=false;setCaption();setPlayLabel();}
function toggle(){if(ended){go(0);playing=true;}else playing=!playing;setPlayLabel();$('hint').style.opacity=0;}
$('play').addEventListener('click',toggle);
$('snd').addEventListener('click',()=>{const v=SND.toggle();$('snd').setAttribute('aria-pressed',v);$('snd').textContent=v?'♪ Sound on':'♪ Sound off';$('hint').style.opacity=0;if(v&&!playing&&!ended){playing=true;setPlayLabel();}});
$('prev').addEventListener('click',()=>go(st>1.2?scene:scene-1));
$('next').addEventListener('click',()=>go(scene+1));
cv.addEventListener('click',toggle);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='ArrowRight')go(scene+1);else if(e.key==='ArrowLeft')go(scene-1);else if(e.key===' '){e.preventDefault();toggle();}});
window.__seek=(i,t)=>{scene=i;st=t;playing=false;setCaption();};

const grain=document.createElement('canvas');grain.width=grain.height=180;{const g=grain.getContext('2d'),d=g.createImageData(180,180);for(let i=0;i<d.data.length;i+=4){const v=205+Math.random()*50;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);}
let grainPat=null;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
new ResizeObserver(resize).observe(cv);resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;boil=Math.floor(T*8);
  if(playing&&!ended){st+=dt;if(st>=SCENES[scene].D){if(scene<SCENES.length-1){scene++;st=0;setCaption();}else{st=SCENES[scene].D;ended=true;playing=false;setPlayLabel();SND.finale();}}}
  SND.tick(scene,st,playing&&!ended);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  try{SCENES[scene].draw(st);}catch(err){console.error(err);}
  if(!grainPat)grainPat=ctx.createPattern(grain,'repeat');
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.45;const o=REDUCED?0:(boil%5)*31;ctx.translate(-o,-o*.7);ctx.fillStyle=grainPat;ctx.fillRect(o-10,o*.7-10,W+20,H+20);ctx.restore();
  if(st<.35)paint('paper',()=>ctx.fillRect(0,0,W,H),1-st/.35);
  fills.forEach((f,i)=>f.style.transform=`scaleX(${i<scene?1:i>scene?0:clamp(st/SCENES[scene].D)})`);
  requestAnimationFrame(frame);
}
setCaption();setPlayLabel();
if(document.fonts&&document.fonts.load){[`96px ${F.bagel}`,`700 22px ${F.hand}`,`500 14px ${F.mono}`,`italic 32px ${F.serif}`].forEach(f=>document.fonts.load(f).catch(()=>{}));}
requestAnimationFrame(frame);
})();
</script>
